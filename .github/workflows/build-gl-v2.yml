name: Fix GL V2 on iPhone

"on":
  push:
    paths:
      - .github/workflows/fix-gl-v2-game-over.yml
  workflow_dispatch:
    inputs:
      original_run:
        description: Optional GitHub Actions run ID of the original successful build
        type: string
        required: false

permissions:
  actions: read
  contents: read

jobs:
  patch_ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download original unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
        run: |
          run_id="$ORIGINAL_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-gl-v2.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo 'No successful build-gl-v2.yml run was found. Supply its run ID with Run workflow.' >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name GlitchedLegendsV2-iOS --dir "$RUNNER_TEMP/original-ipa"
          test -f "$RUNNER_TEMP/original-ipa/GlitchedLegendsV2.ipa"

      - name: Fix Game Over, pause and Gravity Falls in the IPA
        run: |
          python3 - <<'PY'
          from copy import copy
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import os
          import re
          import shutil

          temp = Path(os.environ['RUNNER_TEMP'])
          original = temp / 'original-ipa' / 'GlitchedLegendsV2.ipa'
          output = temp / 'GlitchedLegendsV2-iPhoneFix.ipa'

          assets = 'Payload/GlitchedLegendsV2.app/assets/assets/'
          first_script = assets + 'scripts/script5.lua'
          second_script = assets + 'scripts/script8.lua'
          pause_script = assets + 'scripts/script10.lua'
          warning_script = assets + 'data/glitched-falls-v3/script6.lua'
          otherworldly_chart = assets + 'data/otherworldly-open/otherworldly-open-hard.json'
          otherworldly_song = assets + 'songs/otherworldly-open/'
          retry_sound = assets + 'sounds/scroll.ogg'
          retry_music = assets + 'music/scroll.ogg'

          with ZipFile(original) as source:
              names = set(source.namelist())
              required = {
                  first_script, second_script, retry_sound, pause_script, warning_script,
                  otherworldly_chart, otherworldly_song + 'Inst.ogg',
                  assets + 'characters/bf_pibby.json',
                  assets + 'images/characters/bf_pibby.png',
                  assets + 'images/characters/bf_pibby.xml',
                  assets + 'sounds/sound_dead.ogg',
                  assets + 'music/Deathbydarkness.ogg',
              }
              if missing := sorted(required - names):
                  raise SystemExit(f'Original IPA is missing required files: {missing}')

              character = json.loads(source.read(assets + 'characters/bf_pibby.json'))
              animations = {entry['anim'] for entry in character['animations']}
              if not {'firstDeath', 'deathLoop', 'deathConfirm'} <= animations:
                  raise SystemExit('Missing Game Over animations for bf_pibby')

              setup = source.read(first_script)
              previous = source.read(second_script)
              if b"'bf_pibby'" not in setup or b"'bf-Death'" not in previous:
                  raise SystemExit('Unexpected original Game Over scripts')
              callbacks = re.findall(rb'\bfunction\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(', previous)
              if callbacks != [b'onCreate']:
                  raise SystemExit('script8.lua has extra callbacks; refusing to overwrite them')
              if not source.read(retry_sound).startswith(b'OggS'):
                  raise SystemExit('Invalid original Retry sound')

              pause = source.read(pause_script)
              if not all(token in pause for token in (
                  b'function onPause()', b'return Function_Stop',
                  b'ILOVEBUTTONS', b'tinocoPaused',
              )):
                  raise SystemExit('Unexpected original keyboard-only pause script')

              warning = source.read(warning_script).decode('utf-8')
              if not all(token in warning for token in (
                  'warnings/DIPPERWARNING', 'keys.justPressed.SPACE',
                  'keys.justPressed.ESCAPE', 'endSong();',
              )):
                  raise SystemExit('Unexpected original Dipper warning script')
              warning = warning.replace(
                  'function onCreate()\n',
                  "function onCreate()\n\taddHaxeLibrary('TouchUtil', 'mobile')\n",
                  1,
              )
              warning_update = """function onUpdate()
              if confirmed ~= 0 then return end
              if not keyJustPressed('space') and runHaxeCode('return TouchUtil.justTapped();') ~= true then return end
              confirmed = 1
              allowCountdown = true
              startCountdown()
              doTweenAlpha('nomorewarningimage', 'warningimage', 0, 1, 'sineOut')
              playSound('confirmMenu')
              runTimer('get back', 6)
              setProperty('did.alpha', 1)
          end

          """
              warning, count = re.subn(
                  r'(?ms)^function onUpdate\(\).*?(?=^function onTimerCompleted\()',
                  warning_update, warning, count=1,
              )
              if count != 1 or "addHaxeLibrary('TouchUtil', 'mobile')" not in warning:
                  raise SystemExit('Could not patch Dipper warning')

              patches = {
                  second_script: setup,
                  pause_script: b'-- iOS uses the native touch pause menu from Psych Engine.\n',
                  warning_script: warning.encode('utf-8'),
              }
              if not any(name.casefold() == (otherworldly_song + 'Voices.ogg').casefold() for name in names):
                  chart = json.loads(source.read(otherworldly_chart))
                  chart['song']['needsVoices'] = False
                  patches[otherworldly_chart] = json.dumps(
                      chart, ensure_ascii=False, separators=(',', ':')
                  ).encode('utf-8')

              with ZipFile(output, 'w') as dest:
                  for entry in source.infolist():
                      info = copy(entry)
                      if entry.filename in patches:
                          dest.writestr(info, patches[entry.filename])
                      elif entry.is_dir():
                          dest.writestr(info, b'')
                      else:
                          with source.open(entry) as src, dest.open(info, 'w') as dst:
                              shutil.copyfileobj(src, dst, length=1024 * 1024)
                  if retry_music not in names:
                      info = copy(source.getinfo(retry_sound))
                      info.filename = info.orig_filename = retry_music
                      dest.writestr(info, source.read(retry_sound))

          with ZipFile(output) as patched:
              if patched.testzip() is not None:
                  raise SystemExit('Could not verify the patched IPA')
              if patched.read(first_script) != patched.read(second_script):
                  raise SystemExit('Game Over scripts disagree')
              if not patched.read(retry_music).startswith(b'OggS'):
                  raise SystemExit('Retry music is missing or invalid')
              for name, data in patches.items():
                  if patched.read(name) != data:
                      raise SystemExit(f'Could not verify the updated file: {name}')

          print(f'Patched {output.name}: {output.stat().st_size:,} bytes')
          PY

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlitchedLegendsV2-iPhoneFix
          path: ${{ runner.temp }}/GlitchedLegendsV2-iPhoneFix.ipa
          if-no-files-found: error
          compression-level: 0
