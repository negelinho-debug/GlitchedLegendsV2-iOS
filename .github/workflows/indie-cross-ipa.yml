name: Build Indie Cross iOS

on: workflow_dispatch

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      IOS_APP: export/release/ios/build/Release-iphoneos/IndieCross.app
      LUAJIT_REF: 4eef1dcb383acc270923f8009c046caa42a4b3b5
    steps:
      - name: Checkout Indie Cross Psych Engine source
        uses: actions/checkout@v4
        with:
          repository: KarimAkra-Stuff/Indie-Cross-Psych-Engine
          ref: 5c896bbe273504b28dcf0564b9514cc9abb96358
          persist-credentials: false

      - name: Configure iPhone app and bundled assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if source.count(old) != count:
                  raise SystemExit(f'Unexpected source at {path}: {old!r}')
              file.write_text(source.replace(old, new), encoding='utf-8')

          replace('Project.xml',
                  'title="Indie Cross-PsychEngine" file="Indie-Cross" packageName="com.idniesus.karimakra" package="com.idniesus.karimakra"',
                  'title="Indie Cross" file="IndieCross" packageName="org.funkin.indiecross" package="org.funkin.indiecross"')
          replace('Project.xml', '<section if="ios">',
                  '<section if="ios">\n\t\t\t<config:ios deployment="13.0" />')

          # The iOS window already uses the project's landscape setting.
          replace('Project.xml', '<haxelib name="extension-orientation" if="mobile" />',
                  '<haxelib name="extension-orientation" if="android" />')
          extra = 'source/psychlua/ExtraFunctions.hx'
          replace(extra, '#if mobile\nimport extension.eightsines.EsOrientation;',
                  '#if android\nimport extension.eightsines.EsOrientation;')
          replace(extra, '#if mobile\n\t\tLua_helper.add_callback(lua, "changeOrientation"',
                  '#if android\n\t\tLua_helper.add_callback(lua, "changeOrientation"')
          replace('source/states/TitleState.hx',
                  '#if mobile\n\t\tFlxG.android.preventDefaultKeys = [BACK];',
                  '#if android\n\t\tFlxG.android.preventDefaultKeys = [BACK];')

          storage = 'source/backend/SUtil.hx'
          replace(storage, 'daPath = LimeSystem.applicationStorageDirectory;',
                  'var appPath = Path.addTrailingSlash(LimeSystem.applicationDirectory);\n'
                  '\t\tvar resourcePath = appPath + "assets/";\n'
                  '\t\tdaPath = FileSystem.exists(resourcePath + "assets/weeks/weekList.txt") ? resourcePath : appPath;')
          replace(storage, '#if mobile\n\t\tif (!FileSystem.exists(SUtil.getPath() + \'assets\')',
                  '#if (mobile && !ios)\n\t\tif (!FileSystem.exists(SUtil.getPath() + \'assets\')')

          main = 'source/Main.hx'
          replace(main, '\t\tSUtil.checkFiles();',
                  '\t\t#if ios\n\t\tSys.setCwd(SUtil.getPath());\n\t\t#end\n\t\tSUtil.checkFiles();')

          # Keep crash reports and chart exports in the writable app container.
          source = Path(storage).read_text(encoding='utf-8')
          source = source.replace("SUtil.getPath() + 'logs", "SUtil.writablePath() + 'logs")
          source = source.replace("SUtil.getPath()\n\t\t\t\t+ 'logs/'", "SUtil.writablePath()\n\t\t\t\t+ 'logs/'")
          source = source.replace("SUtil.getPath() + 'saves", "SUtil.writablePath() + 'saves")
          method = '''\tpublic static function writablePath():String
          \t{
          \t\t#if ios
          \t\treturn Path.addTrailingSlash(LimeSystem.applicationStorageDirectory);
          \t\t#else
          \t\treturn getPath();
          \t\t#end
          \t}

          '''
          source = source.replace('\tpublic static function checkFiles():Void', method + '\tpublic static function checkFiles():Void', 1)
          Path(storage).write_text(source, encoding='utf-8')
          replace(storage, '\tpublic static function checkFiles():Void\n\t{\n\t\t#if android',
                  '\tpublic static function checkFiles():Void\n\t{\n'
                  '\t\t#if ios\n\t\tvar dataDirectory = writablePath();\n'
                  '\t\tif (!FileSystem.exists(dataDirectory)) FileSystem.createDirectory(dataDirectory);\n'
                  '\t\t#end\n\t\t#if android')

          # Keep the mod order in writable storage while reading the bundled assets.
          mods = 'source/backend/Mods.hx'
          replace(mods, '\tpublic static var updatedOnState:Bool = false;',
                  '''\tpublic static function getListPath():String
          \t\treturn SUtil.writablePath() + 'modsList.txt';

          \tprivate static function readList():Array<String>
          \t{
          \t\t#if (ios && sys)
          \t\tvar path = getListPath();
          \t\treturn FileSystem.exists(path) ? CoolUtil.listFromString(File.getContent(path)) : [];
          \t\t#else
          \t\treturn CoolUtil.coolTextFile('modsList.txt');
          \t\t#end
          \t}

          \tpublic static var updatedOnState:Bool = false;''')
          replace(mods, "for (mod in CoolUtil.coolTextFile('modsList.txt'))",
                  'for (mod in readList())', count=2)
          replace(mods, "File.saveContent(SUtil.getPath() + 'modsList.txt', fileStr);",
                  'File.saveContent(getListPath(), fileStr);')
          replace('source/states/ModsMenuState.hx', "var path:String = SUtil.getPath() + 'modsList.txt';",
                  'var path:String = Mods.getListPath();')
          replace('source/backend/WeekData.hx', '\t\t#if MODS_ALLOWED\n\t\tif (FileSystem.exists("modsList.txt"))',
                  '\t\t#if (ios && MODS_ALLOWED)\n\t\tMods.loadTopMod();\n'
                  '\t\t#elseif MODS_ALLOWED\n\t\tif (FileSystem.exists("modsList.txt"))')
          replace('source/lime/utils/Log.hx', 'SUtil.getPath()', 'SUtil.writablePath()', count=3)
          PY

      - name: Fingerprint iPhone build
        id: build_inputs
        run: |
          # Bump the prefix when changing compiler versions or build options.
          fingerprint="$({
            printf '%s\n' 'indiecross-ios-v1' "$LUAJIT_REF"
            git rev-parse HEAD
            git diff --binary HEAD
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "key=indiecross-ios-${RUNNER_ARCH}-${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Restore compiled iPhone app
        id: cached_app
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.IOS_APP }}
          key: ${{ steps.build_inputs.outputs.key }}

      - name: Set up Haxe
        if: steps.cached_app.outputs.cache-hit != 'true'
        run: |
          brew install neko
          mkdir -p "$RUNNER_TEMP/haxe"
          curl -fsSL --retry 3 \
            https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-osx.tar.gz \
            --output "$RUNNER_TEMP/haxe.tar.gz"
          tar -xzf "$RUNNER_TEMP/haxe.tar.gz" -C "$RUNNER_TEMP/haxe" --strip-components=1
          echo "$RUNNER_TEMP/haxe" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$RUNNER_TEMP/haxe/std" >> "$GITHUB_ENV"

      - name: Install engine dependencies
        if: steps.cached_app.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/haxelib"
          haxelib setup "$RUNNER_TEMP/haxelib"
          haxelib --never install hxcpp 4.3.2
          haxelib --never install lime 7.9.0
          haxelib --never install openfl 9.2.1
          haxelib --never install flixel 5.3.1
          haxelib --never install flixel-addons 3.2.0
          haxelib --never install flixel-ui 2.5.0
          haxelib --never install tjson 1.4.0
          haxelib --never git linc_luajit https://github.com/HomuHomu833/linc_luajit.git "$LUAJIT_REF"

          # The Haxelib registry package for this version aborts compilation.
          sscript="$RUNNER_TEMP/SScript-6.1.80.zip"
          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/CCobaltDev/SScript-Archive/eed92c5108107f0a6a2359a1029dd136ef6817cd/archives/SScript-6%2C1%2C80.zip' \
            --output "$sscript"
          printf '%s  %s\n' '6fb4e1f1b4caf441fda47945902195dfe5781e7337289d8d2edf18823ccce5a1' "$sscript" | shasum -a 256 -c -
          haxelib --never install "$sscript"

      - name: Generate Xcode project
        if: steps.cached_app.outputs.cache-hit != 'true'
        run: haxelib run lime update ios -arm64

      - name: Compile unsigned for iPhone
        if: steps.cached_app.outputs.cache-hit != 'true'
        working-directory: export/release/ios
        run: |
          export HXCPP_COMPILE_THREADS="$(sysctl -n hw.logicalcpu)"
          xcodebuild build \
            -project IndieCross.xcodeproj \
            -target IndieCross -configuration Release -sdk iphoneos \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos"

      - name: Save compiled iPhone app
        if: steps.cached_app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.IOS_APP }}
          key: ${{ steps.build_inputs.outputs.key }}

      - name: Verify app and package IPA
        run: |
          test -f "$IOS_APP/Info.plist"
          xcrun lipo "$IOS_APP/IndieCross" -verify_arch arm64
          weeks="$(find "$IOS_APP" -path '*/assets/weeks/weekList.txt' -type f -print -quit)"
          test -n "$weeks" || { echo 'Missing weekList.txt'; exit 1; }
          assets="$(dirname "$(dirname "$weeks")")"
          for song in snake-eyes sansational imminent-demise devils-gambit bad-time despair \
            satanic-funkin bad-to-the-bone bonedoggle ritual freaky-machine; do
            test -f "$assets/songs/$song/Inst.ogg" || { echo "Missing audio: $song"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/indie-ipa/Payload"
          ditto "$IOS_APP" "$RUNNER_TEMP/indie-ipa/Payload/IndieCross.app"
          cd "$RUNNER_TEMP/indie-ipa"
          zip -q -1 -r -y Indie-Cross-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Indie-Cross-iOS
          path: ${{ runner.temp }}/indie-ipa/Indie-Cross-iOS.ipa
          if-no-files-found: error
          compression-level
