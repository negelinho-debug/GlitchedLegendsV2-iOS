name: Get Indie Cross iOS IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Optional direct HTTPS link to a mirror of the iOS IPA
        type: string
        required: false

permissions: {}

jobs:
  ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_PAGE: https://www.mediafire.com/file/sqteop2ltpyhm7q/giga_indie.ipa/file
      IPA_URL: ${{ inputs.ipa_url }}
    steps:
      - name: Download and verify iPhone app
        shell: bash
        run: |
          ipa="$RUNNER_TEMP/Indie-Cross-iOS-V2.ipa"
          headers=()
          if [[ -z "$IPA_URL" ]]; then
            page="$RUNNER_TEMP/indie-release.html"
            cookies="$RUNNER_TEMP/indie-cookies.txt"
            curl -fsSL --proto '=https' --proto-redir '=https' --retry 2 \
              --connect-timeout 20 --max-time 60 --user-agent 'Mozilla/5.0' \
              --cookie-jar "$cookies" --output "$page" -- "$RELEASE_PAGE"
            IPA_URL=$(python3 - "$page" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          class MediaFirePage(HTMLParser):
              url = ''

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and attrs.get('id') == 'downloadButton':
                      self.url = attrs.get('href') or ''

          parser = MediaFirePage()
          parser.feed(Path(sys.argv[1]).read_text(errors='replace'))
          url = urlsplit(parser.url)
          if url.scheme != 'https' or not (url.hostname or '').endswith('.mediafire.com'):
              sys.exit('MediaFire did not expose the iOS download link.')
          print(parser.url)
          PY
            )
            headers=(--cookie "$cookies" --referer "$RELEASE_PAGE")
          fi

          curl -fsSL --proto '=https' --proto-redir '=https' --retry 2 \
            --connect-timeout 20 --max-time 660 --retry-max-time 720 \
            --user-agent 'Mozilla/5.0' "${headers[@]}" --output "$ipa" -- "$IPA_URL"
          python3 - "$ipa" <<'PY'
          from pathlib import PurePosixPath
          from zipfile import BadZipFile, ZipFile
          import plistlib
          import sys

          try:
              with ZipFile(sys.argv[1]) as archive:
                  entries = set(archive.namelist())
                  for name in sorted(entries):
                      path = PurePosixPath(name)
                      if (len(path.parts) != 3 or path.parts[0] != 'Payload'
                          or path.name != 'Info.plist' or path.parent.suffix != '.app'):
                          continue
                      app = plistlib.loads(archive.read(name))
                      executable = app.get('CFBundleExecutable', '')
                      platforms = app.get('CFBundleSupportedPlatforms', [])
                      if platforms and 'iPhoneOS' not in platforms:
                          continue
                      binary = str(path.parent / executable)
                      if executable and binary in entries and archive.getinfo(binary).file_size > 0:
                          print('Found iOS app:', app.get('CFBundleDisplayName') or path.parent.stem)
                          break
                  else:
                      sys.exit('No iOS app bundle and executable found inside Payload/.')
          except (BadZipFile, plistlib.InvalidFileException):
              sys.exit('The server returned an invalid IPA. Check the release link or provide a direct IPA mirror.')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Indie-Cross-iOS-V2
          path: ${{ runner.temp }}/Indie-Cross-iOS-V2.ipa
          if-no-files-found: error
          compression-level: 0
